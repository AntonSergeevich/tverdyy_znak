{% if goals %}
  <div class="stack">
    {% for goal in goals %}
      {% include "cabinet/student/partials/goal_card.html" %}
    {% endfor %}
  </div>
{% else %}
  <div class="empty-state">
    <p class="empty-state__title">Целей пока нет</p>
    <p>Начните с одной — хоть открытой, хоть скрытой. Потом разложите её на
       шаги, и спутник пойдёт по пути вместе с вами.</p>
  </div>
{% endif %}
