{% if rows %}
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>Название</th><th>Сокращение</th><th>Часов</th><th>Занятий</th><th></th></tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td><strong>{{ row.name }}</strong></td>
            <td class="muted">{{ row.short_name|default:"—" }}</td>
            <td class="numeral">{{ row.weekly_hours }}</td>
            <td class="numeral muted">{{ row.lessons_count }}</td>
            <td>
              <a href="{% url 'cabinet:subject_edit' row.pk %}">Изменить</a> ·
              <a href="{% url 'cabinet:subject_delete' row.pk %}">Удалить</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="muted">Пока пусто.</p>
{% endif %}
