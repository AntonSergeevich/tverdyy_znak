{% comment %}
  Один блок доступа. Отдельным файлом, потому что при заведении ученика
  их сразу два: ребёнку и родителю.
{% endcomment %}
<div class="creds__card">
  <p class="creds__who">
    {{ credentials.full_name }}
    <span class="muted">· {{ credentials.role_label }}</span>
  </p>
  <dl class="creds__list">
    <dt>Ссылка</dt><dd><code>{{ login_url }}</code></dd>
    <dt>Логин</dt><dd><code>{{ credentials.login }}</code></dd>
    <dt>Пароль</dt><dd><code>{{ credentials.password }}</code></dd>
  </dl>
  <button class="btn btn--quiet" type="button" data-copy
          data-copy-text="Вход в кабинет «Твёрдый знак»&#10;{{ login_url }}&#10;Логин: {{ credentials.login }}&#10;Пароль: {{ credentials.password }}">
    Скопировать для отправки
  </button>
  <span class="creds__copied" data-copy-done hidden>Скопировано</span>
</div>
