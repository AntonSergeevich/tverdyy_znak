<tr id="student-{{ student.pk }}">
  <td><strong>{{ student.full_name }}</strong></td>
  <td>{{ student.grade_level }}</td>
  <td>{{ student.get_status_display }}{% if student.is_deleted %} · удалён {{ student.deleted_at|date:"d.m.Y" }}{% endif %}</td>
  <td class="muted">{{ student.attestation_partner|default:"—" }}</td>
  <td>
    {% if student.is_deleted %}
      <form hx-post="{% url 'cabinet:student_restore' student.pk %}" hx-target="#student-{{ student.pk }}" hx-swap="outerHTML">
        {% csrf_token %}
        <button class="btn btn--quiet" type="submit">Восстановить</button>
      </form>
    {% else %}
      <a href="{% url 'cabinet:parent_child' student.pk %}">Карточка</a>
    {% endif %}
  </td>
</tr>
