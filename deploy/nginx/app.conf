# HTTP: только ACME-челлендж и редирект на HTTPS.
server {
    listen 80;
    server_name tverdyy-znak.ru www.tverdyy-znak.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tverdyy-znak.ru www.tverdyy-znak.ru;

    ssl_certificate     /etc/letsencrypt/live/tverdyy-znak.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tverdyy-znak.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Заголовки безопасности (ТЗ 2.3, 8.1) ──────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # CSP: скрипты и стили только свои. Метрика и карта грузятся по согласию,
    # поэтому их домены перечислены явно, а не через 'unsafe-inline' для всего.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' https://mc.yandex.ru; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: https://mc.yandex.ru; \
font-src 'self'; \
connect-src 'self' https://mc.yandex.ru; \
frame-src https://yandex.ru https://*.yandex.ru; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'" always;

    limit_conn perip 20;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Публичные медиа (фото педагогов и помещения).
    # Файлы с персональными данными сюда не попадают: они лежат
    # в private-media и отдаются вью с проверкой прав (ТЗ 8.1).
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location = /zayavka/ {
        limit_req zone=forms burst=5 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /vhod/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
