name: Тесты и выкат

# Выкат происходит при пуше в ветку разработки: код уходит на сервер
# сам, локальная машина в этом не участвует.
on:
  push:
    branches:
      - claude/tverdyy-znak-django-sdrptm
      - main
  workflow_dispatch:

concurrency:
  # Два выката одновременно на один сервер — это гонка за docker compose.
  # Новый пуш отменяет предыдущий незавершённый выкат.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tz
          POSTGRES_PASSWORD: tz
          POSTGRES_DB: tverdyy_znak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://tz:tz@127.0.0.1:5432/tverdyy_znak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  deploy:
    name: Выкат
    needs: tests
    runs-on: ubuntu-latest
    # На сервер уходит только то, что прошло тесты.
    steps:
      - name: Проверяю секреты
        # Без этого отсутствующий секрет превращается в невнятную ошибку
        # ssh про пустой адрес. Секреты должны быть на уровне репозитория
        # (Repository secrets), а не окружения: окружение job не объявляет.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты:$missing" >&2
            echo "Settings → Secrets and variables → Actions → Repository secrets." >&2
            echo "Секреты окружения (Environment secrets) сюда не подходят: " >&2
            echo "job их не видит, пока не объявит environment." >&2
            exit 1
          fi

      - name: Ключ SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Ключ, вставленный в секрет с Windows, приходит с \r в конце
          # каждой строки и нередко без перевода строки после END. OpenSSH
          # отвечает на это «error in libcrypto» — ровно так падали все
          # выкаты с первого дня. Убираем \r и ставим перевод строки в конце.
          clean=$(printf '%s' "$KEY" | tr -d '\r' \
                  | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d')

          # Частая ошибка копирования: взята только середина ключа — без
          # строк BEGIN и END. Так и лежал секрет после первой замены:
          # пять строк, 340 символов. Середина при этом цела, а заголовок
          # и концовка у всех ключей OpenSSH одинаковые, так что дописать
          # их безопасно: ниже ssh-keygen всё равно проверит результат.
          if ! printf '%s' "$clean" | grep -q -- '-----BEGIN' \
             && printf '%s' "$clean" | tr -d '\n' | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "В секрете только середина ключа, без строк BEGIN и END — дописываю их."
            clean=$(printf '%s\n%s\n%s' \
              "-----BEGIN OPENSSH PRIVATE KEY-----" "$clean" "-----END OPENSSH PRIVATE KEY-----")
          fi
          printf '%s\n' "$clean" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Проверяем, что ключ вообще читается, ещё до сервера. Иначе
          # «ключ битый» и «ключа нет на сервере» выглядят одинаково —
          # одним «Permission denied», и понять, что чинить, нельзя.
          # -P '' — ключ с паролем здесь не годится: вводить его некому.
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2> /tmp/key-error; then
            echo "Секрет DEPLOY_SSH_KEY не читается как приватный ключ OpenSSH:" >&2
            cat /tmp/key-error >&2

            # Что именно лежит в секрете — приметами, без содержимого.
            # Печатать сам ключ нельзя, а «не читается» не говорит, что
            # чинить: вставили .pub, ключ PuTTY, обрезанный кусок или
            # положили не в Secrets, а в Variables и секрет остался старым.
            clean=$(printf '%s' "$KEY" | tr -d '\r')
            echo "" >&2
            echo "Что в секрете (сам ключ не показывается):" >&2
            echo "  строк: $(printf '%s\n' "$clean" | wc -l), символов: ${#clean}" >&2
            echo "  (у рабочего ключа ed25519 обычно 7 строк и около 400 символов)" >&2
            case "$clean" in
              "")
                echo "  → секрет пустой" >&2 ;;
              "-----BEGIN OPENSSH PRIVATE KEY-----"*)
                echo "  → начало правильное: BEGIN OPENSSH PRIVATE KEY" >&2 ;;
              "-----BEGIN"*)
                echo "  → ключ в старом формате PEM (RSA/EC), а не OpenSSH" >&2 ;;
              ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*)
                echo "  → это ПУБЛИЧНЫЙ ключ (.pub). Нужен файл без .pub" >&2 ;;
              PuTTY-User-Key-File*)
                echo "  → это ключ PuTTY (.ppk). Нужен ключ OpenSSH" >&2 ;;
              \"*|\'*)
                echo "  → ключ вставлен в кавычках — кавычки надо убрать" >&2 ;;
              " "*|"	"*)
                echo "  → перед ключом пробелы — вставлено с отступом" >&2 ;;
              *)
                echo "  → начинается не с BEGIN: скопировано не с начала" >&2 ;;
            esac
            # Про конец говорим только о том, что начиналось как ключ:
            # у .pub и PuTTY строки END нет и быть не должно, и слово
            # «обрезан» там увело бы не туда.
            case "$clean" in
              *"-----BEGIN"*"-----END OPENSSH PRIVATE KEY-----"*)
                echo "  → конец на месте: END OPENSSH PRIVATE KEY" >&2 ;;
              *"-----BEGIN"*)
                echo "  → строки END нет: ключ обрезан при копировании" >&2 ;;
            esac
            case "$clean" in
              *ENCRYPTED*|*aes256-ctr*|*bcrypt*)
                echo "  → ключ запаролен — нужен ключ без пароля" >&2 ;;
            esac
            echo "" >&2
            echo "Кладётся в Settings → Secrets and variables → Actions →" >&2
            echo "вкладка Secrets (не Variables) → Repository secrets." >&2
            echo "Нужен приватный ключ целиком — от строки" >&2
            echo "  -----BEGIN OPENSSH PRIVATE KEY-----" >&2
            echo "до строки" >&2
            echo "  -----END OPENSSH PRIVATE KEY-----" >&2
            echo "без пароля. Не файл .pub и не .ppk из PuTTY." >&2
            exit 1
          fi
          # Отпечаток — не секрет. По нему видно, тот ли это ключ, что
          # лежит на сервере в ~/.ssh/authorized_keys.
          echo "Ключ читается. Отпечаток:"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Выкатываю
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Та же команда, что человек набирает на сервере руками.
          # Один путь выката — меньше шансов, что «через CI» и «руками»
          # начнут делать разное.
          # Если короткая команда на сервере ещё не установлена (симлинк
          # ставит provision.sh), зовём скрипт по полному пути — выкат не
          # должен зависеть от того, дошли ли руки до симлинка.
          # BatchMode: без него ssh после отказа по ключу пробует пароль,
          # и в логе появляются бессмысленные «please try again».
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "$USER@$HOST" \
            "command -v tz-deploy >/dev/null && tz-deploy '$BRANCH' || bash /srv/tverdyy-znak/deploy/scripts/pull-and-deploy.sh '$BRANCH'"
